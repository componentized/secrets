[workspace]
resolver = "2"
members = [
    "components/empty",
    "components/from-config",
    "components/gate",
    "components/latch-defer-all",
    "components/latch-deny-all",
    "components/latch-key",
    "components/latch-n2",
    "components/latch-n3",
    "components/latch-n4",
    "components/latch-n5",
    "components/test-consumer",
    "components/to-wasmcloud",
    "crates/secrets-latch-n",
    "crates/test-harness",
]

[workspace.dependencies]
secrets-latch-n = { path = "./crates/secrets-latch-n" }
test-harness = { path = "./crates/test-harness" }
tokio = { version = "1", features = ["macros", "rt"] }
wasmtime = "50.0.1"
wit-bindgen = "0.63.0"
